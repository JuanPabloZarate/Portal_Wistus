name: CI Portal Wistus

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate HTML & JSON Syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('✅ vercel.json is valid');"
          node -e "const fs = require('fs'); ['index.html', 'README.md'].forEach(f => { if (!fs.existsSync(f)) throw new Error('Missing ' + f); }); console.log('✅ Core files exist');"

      - name: Lint JavaScript (Syntax Check)
        run: |
          node -c js/data.js
          node -c js/state.js
          node -c js/auth.js
          node -c js/asistencias.js
          node -c js/pagos.js
          node -c js/miembros.js
          node -c js/app.js
          echo "✅ All JavaScript modules have valid syntax"
