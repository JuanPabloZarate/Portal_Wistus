<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="yellowShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="lilacBorderEscudo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glowShieldYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#3b0764" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#glowShieldYellow)">
    <!-- Escudo externo amarillo -->
    <path d="M 200,25 C 290,25 350,55 350,140 C 350,260 270,335 200,375 C 130,335 50,260 50,140 C 50,55 110,25 200,25 Z" 
          fill="url(#yellowShieldGrad)" stroke="url(#lilacBorderEscudo)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Borde interior punteado lila -->
    <path d="M 200,45 C 275,45 330,70 330,145 C 330,245 260,315 200,350 C 140,315 70,245 70,145 C 70,70 125,45 200,45 Z" 
          fill="none" stroke="#5b21b6" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Plumas de Montera en Lila y Amarillo -->
    <g transform="translate(200, 115)">
      <path d="M -55,-55 C -65,-95 -45,-105 -35,-65 Z" fill="#5b21b6" />
      <path d="M -30,-65 C -35,-110 -15,-115 -10,-70 Z" fill="#7c3aed" />
      <path d="M 0,-70 C 0,-125 15,-125 15,-70 Z" fill="#fbbf24" />
      <path d="M 10,-70 C 15,-115 35,-110 30,-65 Z" fill="#a855f7" />
      <path d="M 35,-65 C 45,-105 65,-95 55,-55 Z" fill="#c084fc" />

      <!-- Casco / Montera -->
      <path d="M -60,-20 C -65,-55 65,-55 60,-20 C 60,10 40,25 0,28 C -40,25 -60,10 -60,-20 Z" 
            fill="#2e1065" stroke="#fbbf24" stroke-width="3"/>
      <!-- Adorno frontal -->
      <path d="M -45,-15 Q 0,-25 45,-15" fill="none" stroke="#fbbf24" stroke-width="3"/>
      <circle cx="-30" cy="-18" r="4" fill="#a855f7"/>
      <circle cx="0" cy="-22" r="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="30" cy="-18" r="4" fill="#a855f7"/>
    </g>

    <!-- Chakana Andina Central con Monograma W Lila en Fondo Amarillo -->
    <g transform="translate(200, 235) scale(0.95)">
      <path d="M -15,-45 L 15,-45 L 15,-30 L 30,-30 L 30,-15 L 45,-15 L 45,15 L 30,15 L 30,30 L 15,30 L 15,45 L -15,45 L -15,30 L -30,30 L -30,15 L -45,15 L -45,-15 L -30,-15 L -30,-30 L -15,-30 Z" 
            fill="#5b21b6" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="#fbbf24" stroke="#5b21b6" stroke-width="2"/>
      <!-- Letra W en Lila -->
      <text x="0" y="7" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-weight="900" font-size="20" fill="#5b21b6">W</text>
    </g>

    <!-- Laureles Lila -->
    <path d="M 95,240 C 85,190 100,150 115,130" fill="none" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/>
    <path d="M 305,240 C 315,190 300,150 285,130" fill="none" stroke="#5b21b6" stroke-width="4" stroke-linecap="round"/>

    <!-- Cinta con Fraternidad Tinkus Wistus -->
    <path d="M 90,310 Q 200,340 310,310 L 320,338 Q 200,372 80,338 Z" fill="#5b21b6" stroke="#fbbf24" stroke-width="2"/>
    <text x="200" y="335" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="12" font-weight="900" fill="#fff8cc" letter-spacing="2">TINKUS WISTUS</text>
  </g>
</svg>